import com.github.martinambrus.rdforward.buildsrc.legacyapi.BridgeSpec
import com.github.martinambrus.rdforward.buildsrc.legacyapi.LegacyBridgeInjector
import com.github.martinambrus.rdforward.buildsrc.legacyapi.LegacyFieldSpec

plugins {
    id 'java-library'
}

description = 'RDForward Bukkit Bridge - loads Bukkit plugins as RDForward mods'

java {
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

compileJava {
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

/**
 * Output directory for ASM-patched copies of compiled classes that need
 * legacy-API bridge methods. Kept SEPARATE from compileJava's output so
 * Java source compilation (main + test) always sees the un-patched
 * interface — Java source can't declare two methods with same
 * name+params and different return types, so any source-level
 * implementor of {@code Server} must compile against the un-patched
 * shape. The jar and test-runtime classpaths prepend this directory
 * so the JVM loads the patched class at runtime, where old plugins
 * (VanishNoPacket 3.15) need both descriptors to resolve. See the
 * buildSrc {@code LegacyBridgeInjector} class for ASM details.
 */
def legacyPatchedDir = layout.buildDirectory.dir('classes-legacy-patched')

tasks.register('injectLegacyApiBridges', Copy) {
    description = 'Produce legacy-bridge-patched copies of select interface .class files alongside the un-patched main output.'
    dependsOn compileJava
    from compileJava.destinationDirectory
    into legacyPatchedDir
    // Only the classes that actually need patching live in this output
    // tree. Everything else stays in compileJava's destination so
    // we don't duplicate the whole class tree.
    include 'org/bukkit/Server.class'
    include 'org/bukkit/Sound.class'
    doLast {
        def serverClass = legacyPatchedDir.get().file('org/bukkit/Server.class').asFile
        if (!serverClass.exists()) {
            throw new GradleException("Patched copy missing: ${serverClass}")
        }
        // Server.getOnlinePlayers — pre-Bukkit-1.7 returned Player[];
        // modern returns Collection<? extends Player>. Both descriptors
        // must coexist for legacy plugins (VanishNoPacket 3.15) and
        // modern plugins (LP, VNP 3.22) to call without
        // NoSuchMethodError.
        LegacyBridgeInjector.inject(
                serverClass.toPath(),
                'org/bukkit/Server',
                [BridgeSpec.collectionToArray(
                        'getOnlinePlayers',
                        '()Ljava/util/Collection;',
                        '()[Lorg/bukkit/entity/Player;',
                        'org/bukkit/entity/Player')]
        )

        // Sound legacy aliases — pre-Bukkit-1.9 used short flat names
        // (Sound.EXPLODE) that were renamed to namespaced forms
        // (Sound.ENTITY_GENERIC_EXPLODE) in 1.9. Old plugins compiled
        // against the short names crash with NoSuchFieldError on the
        // modern stub; injecting the legacy symbols as null-default
        // static fields lets the lookup resolve. Plugins typically
        // forward the resulting null to playSound/playEffect, which
        // already StubCallLog and no-op.
        def soundClass = legacyPatchedDir.get().file('org/bukkit/Sound.class').asFile
        if (!soundClass.exists()) {
            throw new GradleException("Patched copy missing: ${soundClass}")
        }
        LegacyBridgeInjector.inject(
                soundClass.toPath(),
                'org/bukkit/Sound',
                [],
                [LegacyFieldSpec.of('EXPLODE', 'Lorg/bukkit/Sound;')]
        )
    }
}

// Drop the un-patched Server.class that flows in from sourceSets.main.output
// and replace it with the patched copy from legacyPatchedDir, so the jar
// shipped to plugin classloaders carries both descriptor variants.
//
// `eachFile` is used (rather than top-level `exclude`) so the exclusion
// only applies to the un-patched copy: matching by absolute path against
// the patched output directory lets the patched copy through.
jar {
    dependsOn injectLegacyApiBridges
    eachFile { fcd ->
        if ((fcd.path == 'org/bukkit/Server.class'
                || fcd.path == 'org/bukkit/Sound.class')
                && !fcd.file.absolutePath.contains('classes-legacy-patched')) {
            fcd.exclude()
        }
    }
    from(legacyPatchedDir) {
        include 'org/bukkit/Server.class'
        include 'org/bukkit/Sound.class'
    }
}

// Default :test excludes @Tag("thirdparty") so CI stays fast and does
// not depend on the staged third-party fixture jars. The dedicated
// :testThirdParty task runs only those tagged tests — invoke it
// explicitly when validating generated stubs against a real plugin.
//
// Both Test tasks prepend the patched-classes dir so the JVM loads the
// legacy-bridge-patched Server interface at runtime, while
// compileTestJava keeps using the un-patched build/classes/java/main
// on the compile classpath.
test {
    dependsOn injectLegacyApiBridges
    classpath = files(legacyPatchedDir) + classpath
    useJUnitPlatform { excludeTags 'thirdparty' }
}

tasks.register('testThirdParty', Test) {
    description = 'Runs smoke tests tagged @Tag("thirdparty") against staged third-party plugin jars.'
    group = 'verification'
    dependsOn injectLegacyApiBridges
    useJUnitPlatform { includeTags 'thirdparty' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(legacyPatchedDir) + sourceSets.test.runtimeClasspath
    testLogging { showStandardStreams = true }
}

dependencies {
    implementation project(':rd-api')
    implementation project(':rd-mod-loader')
    implementation project(':rd-server')
    implementation 'org.yaml:snakeyaml:1.33'
    // ByteBuddy mints a runtime Player subclass that extends
    // CraftHumanEntity (so LuckPerms's reflective Field.get/set on
    // 'perm' actually targets a real superclass field) while still
    // implementing the Bukkit Player interface contract.
    implementation 'net.bytebuddy:byte-buddy:1.17.5'
    // ASM for plugin bytecode rewriting (legacy-Guava compatibility shim).
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-tree:9.9.1'
    implementation 'org.ow2.asm:asm-commons:9.9.1'
    // Maven Resolver for Paper-style plugin library loading (transitive deps).
    implementation 'org.apache.maven.resolver:maven-resolver-supplier:1.9.22'

    // compileOnly: libraries referenced in paper-api signatures that the
    // runtime server ships itself. Bundling them here would duplicate state
    // with the host server and risk classloader conflicts.
    compileOnly 'com.google.guava:guava:33.5.0-jre'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'it.unimi.dsi:fastutil:8.5.15'
    compileOnly 'net.md-5:bungeecord-chat:1.21-R0.2-deprecated+build.21'
    compileOnly 'org.apache.maven.resolver:maven-resolver-api:1.9.18'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    // Third-party smoke tests (tag=thirdparty) load real plugin jars such
    // as LuckPerms; those plugins expect the paper-server-provided libs
    // to be on the runtime classpath. In production rd-server is
    // responsible for shipping them; for the smoke test we pull them in
    // on testRuntimeOnly so the test classloader resolves them.
    testRuntimeOnly 'com.google.guava:guava:33.5.0-jre'
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.17'
}

task distApi(type: Copy) {
    description = 'Gather Bukkit bridge classes + sources + javadoc JARs for mod-author distribution'
    group = 'build'
    dependsOn jar, sourcesJar, javadocJar

    from(jar.archiveFile) { rename { "rdforward-bukkit-api-${project.version}.jar" } }
    from(sourcesJar.archiveFile) { rename { "rdforward-bukkit-api-${project.version}-sources.jar" } }
    from(javadocJar.archiveFile) { rename { "rdforward-bukkit-api-${project.version}-javadoc.jar" } }
    into layout.buildDirectory.dir('dist')
}
